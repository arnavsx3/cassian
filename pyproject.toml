[project]
name = "cassian"
version = "0.1.0"
description = "Risk-aware spot fleet optimizer"
readme = "README.md"
authors = [
    { name = "arnavsx3", email = "arnavsx3@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43.83",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "pydantic-settings>=2.15.0",
    "uvicorn>=0.52.4",
]

[project.scripts]
cassian = "cassian:main"

[build-system]
requires = ["uv_build>=0.11.11,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.5",
]
